basePath: /api/v1
definitions:
  request.AddFamilyMemberRequest:
    properties:
      familyID:
        type: string
      members:
        items:
          $ref: '#/definitions/request.Member'
        type: array
    required:
    - familyID
    - members
    type: object
  request.CreateMessageRequest:
    properties:
      content:
        type: string
    type: object
  request.CreateRoleRequest:
    properties:
      name:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  request.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  request.Member:
    properties:
      role:
        type: string
      userID:
        type: string
    type: object
  request.RegisterRequest:
    properties:
      date_of_birth:
        type: string
      email:
        type: string
      gender:
        minLength: 1
        type: string
      name:
        minLength: 3
        type: string
      password:
        type: string
    required:
    - date_of_birth
    - email
    - gender
    - name
    - password
    type: object
  request.UpdateFamilyRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - description
    - name
    type: object
  request.UpdateProfileRequest:
    properties:
      activity_level:
        type: string
      date_of_birth:
        type: string
      gender:
        type: string
      height_cm:
        type: number
      weight_kg:
        type: number
    type: object
  request.UpdateRoleRequest:
    properties:
      name:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  response.ErrorResponse:
    properties:
      message:
        example: Internal Server Error
        type: string
      status_code:
        type: integer
      success:
        example: false
        type: boolean
    type: object
  response.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_pages:
        type: integer
      total_rows:
        type: integer
    type: object
  response.PaginationResponse:
    properties:
      data: {}
      message:
        type: string
      pagination:
        $ref: '#/definitions/response.Pagination'
      success:
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        example: data retrieved/created/updated/deleted successfully
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Dokumentasi API untuk Nutrione
